<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>떼소로 보험 — 새 주소로 옮겼습니다</title>
<link rel="icon" href="./icon-192.png">
<style>
  :root{color-scheme:light}
  body{margin:0;font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;
       background:#F5F6F8;color:#222;display:flex;min-height:100vh;
       align-items:center;justify-content:center;padding:20px}
  .box{background:#fff;border-radius:14px;padding:28px 24px;max-width:380px;
       width:100%;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center}
  .mk{width:52px;height:52px;border-radius:13px;background:#FAECE7;color:#A92F1E;
      display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
      font-size:26px;font-weight:700}
  h1{font-size:19px;margin:0 0 6px}
  p{font-size:14px;line-height:1.7;color:#555;margin:0 0 16px}
  a.go{display:block;background:#A92F1E;color:#fff;text-decoration:none;
       padding:13px;border-radius:9px;font-size:16px;font-weight:600}
  .sm{font-size:12px;color:#888;margin-top:14px;line-height:1.6}
  .url{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:#A92F1E;
       word-break:break-all}
</style>
</head>
<body>
<div class="box">
  <div class="mk">떼</div>
  <h1>새 주소로 옮겼습니다</h1>
  <p>보험금 청구 · 보험 약관 · 보험 퀴즈 · 묻고 답하기가<br>
     모두 <b>떼소로 오피스</b> 안으로 들어왔습니다.</p>
  <a class="go" id="go" href="https://office.tesoro2026.com/portal/login">
    떼소로 오피스로 들어가기</a>
  <p class="sm">
    새 주소 — <span class="url">office.tesoro2026.com/portal/login</span><br>
    아이디는 가정마다 하나인 <b>공통ID</b>입니다.<br>
    처음이시면 떼소로앱에서 쓰시던 <b>6자리</b>를 넣으십시오.<br><br>
    바탕화면에 옛 아이콘이 있으면 지우고 새 주소로 다시 추가해 주십시오.<br>
    막히시면 떼소로에 말씀해 주십시오.
  </p>
</div>
<script>
// ★ 옛 PWA 를 물러나게 한다 — 안 그러면 품고 있던 옛 화면이 계속 보인다
(function () {
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (ks) {
        ks.forEach(function (k) { caches.delete(k); });
      }).catch(function () {});
    }
    try { localStorage.clear(); } catch (e) {}
  } catch (e) {}
  // ★ 바로 보내지 않는다 — 왜 바뀌었는지 읽으실 틈을 둔다
  setTimeout(function () {
    location.replace(document.getElementById('go').href);
  }, 4000);
})();
</script>
</body>
</html>
